version: '3.8'

services:
  neuralvision-server:
    build: .
    container_name: neuralvision_studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - TF_ENABLE_ONEDNN_OPTS=0
    volumes:
      - ./models:/app/models
      - ./app/static/samples:/app/app/static/samples
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
